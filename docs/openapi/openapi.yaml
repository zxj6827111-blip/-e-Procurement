      summary: Generate purchase order from approved award decision
      description: >
        Buyer or group manager can generate a lightweight purchase order after quote deadline and
        approved award decision. Supplier, expert, auditor and admin cannot generate orders.
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          description: Missing approved award, selected bid or quote deadline condition.
        "403":
          $ref: "#/components/responses/PermissionDenied"
